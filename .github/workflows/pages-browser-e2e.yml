name: Pages Browser E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for v1.7 Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          URL='https://48wr9f4wgp-lab.github.io/tackle-fit/tackle.html'
          ok=0
          for i in $(seq 1 24); do
            body=$(curl -LfsS "$URL" || true)
            if printf '%s' "$body" | grep -q 'tackle-r'; then ok=1; break; fi
            echo "waiting for v1.7 pages: $i"
            sleep 10
          done
          test "$ok" = "1"

      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live Pages interaction checks
        shell: bash
        run: |
          cat > pages.spec.js <<'EOF'
          const { test, expect } = require('@playwright/test');
          const BASE = 'https://48wr9f4wgp-lab.github.io/tackle-fit';

          async function firstProduct(page, cat) {
            const select=page.locator(`select[data-product="${cat}"]`);
            const value=await select.locator('option:not([value=""])').first().getAttribute('value');
            if (!value) throw new Error(`no product option for ${cat}`);
            await select.selectOption(value);
          }

          test('home navigation works', async ({ page }) => {
            await page.goto(BASE + '/', { waitUntil: 'networkidle' });
            await page.getByRole('link', { name: /今どう釣る/ }).click();
            await expect(page).toHaveURL(/catch\.html/);
            await expect(page.getByRole('button', { name: /現在地から/ })).toBeVisible();
          });

          test('catch searches and selects added fish', async ({ page }) => {
            await page.goto(BASE + '/catch.html', { waitUntil: 'networkidle' });
            await page.locator('#catch-fish-search').fill('キハダマグロ');
            const fish=page.locator('button[data-fish-name="キハダマグロ"]').first();
            await expect(fish).toBeVisible();
            await fish.click();
            await expect(fish).toHaveClass(/active/);
          });

          test('tackle guidance reaches result and mode requirements are clear', async ({ page }) => {
            await page.goto(BASE + '/tackle.html', { waitUntil: 'networkidle' });
            await page.evaluate(()=>localStorage.clear());
            await page.reload({waitUntil:'networkidle'});
            await expect(page.getByText('0/6 入力済み')).toBeVisible();
            await expect(page.locator('#show-result')).toBeDisabled();
            await page.locator('button[data-multi="targets"][data-value="ブリ"]').first().click();
            await page.locator('button[data-multi="methods"][data-value="ショアジギング"]').click();
            await page.locator('button[data-multi="lures"][data-value="メタルジグ"]').click();
            await firstProduct(page,'rod');
            await firstProduct(page,'main_line');
            await firstProduct(page,'reel');
            await expect(page.getByText('6/6 入力済み')).toBeVisible();
            await expect(page.locator('#show-result')).toBeEnabled();
            await page.locator('#show-result').click();
            await expect(page.locator('#result-card')).toBeVisible();

            await page.getByRole('button',{name:'おすすめ構成を作る'}).click();
            await expect(page.getByText(/2\/2 入力済み|0\/2 入力済み/)).toBeVisible();
            await page.getByRole('button',{name:'持っている釣具'}).click();
            await expect(page.getByText(/3\/3 入力済み|0\/3 入力済み/)).toBeVisible();
          });
          EOF
          npx playwright test pages.spec.js --reporter=line --workers=1
