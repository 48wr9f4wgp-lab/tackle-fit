name: COMBAT HUB Main Event Emphasis Patch

# one-shot trigger v2
on:
  push:
    paths:
      - '.github/workflows/combat-hub-main-emphasis-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch main-event emphasis
        shell: python
        run: |
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
            ("// v7.3.0-github — K-1 hero blend polish / safe-live engine unchanged", "// v7.4.0-github — main-event emphasis / safe-live engine unchanged"),
            ("const VERSION='7.3.0-github';", "const VERSION='7.4.0-github';"),
            ("ufc:{heroShade:.68,posterShade:.58,headerShade:.13,mainShade:.12,footShade:.17,veil:.018,gap:17,mainSize:11.7,division:7.3}", "ufc:{heroShade:.68,posterShade:.58,headerShade:.13,mainShade:.12,footShade:.17,veil:.018,gap:17,mainSize:13.4,division:7.3}"),
            ("rizin:{heroShade:.70,posterShade:.60,headerShade:.14,mainShade:.13,footShade:.19,veil:.018,gap:17,mainSize:11.4,division:7.2}", "rizin:{heroShade:.70,posterShade:.60,headerShade:.14,mainShade:.13,footShade:.19,veil:.018,gap:17,mainSize:13.1,division:7.2}"),
            ("one:{heroShade:.68,posterShade:.44,headerShade:.16,mainShade:.15,footShade:.19,veil:.028,gap:19,mainSize:11.7,division:7.3}", "one:{heroShade:.68,posterShade:.44,headerShade:.16,mainShade:.15,footShade:.19,veil:.028,gap:19,mainSize:13.4,division:7.3}"),
            ("boxing:{heroShade:.68,posterShade:.52,headerShade:.18,mainShade:.18,footShade:.23,veil:.020,gap:18,mainSize:11.8,division:7.2}", "boxing:{heroShade:.68,posterShade:.52,headerShade:.18,mainShade:.18,footShade:.23,veil:.020,gap:18,mainSize:13.6,division:7.2}"),
            ("k1:{heroShade:.60,posterShade:.46,headerShade:.10,mainShade:.11,footShade:.17,veil:.055,gap:17,mainSize:11.8,division:7.3}", "k1:{heroShade:.60,posterShade:.46,headerShade:.10,mainShade:.11,footShade:.17,veil:.055,gap:17,mainSize:13.6,division:7.3}"),
            ("}else{w.addSpacer(V.gap);const main=w.addStack();main.centerAlignContent();const aBox=main.addStack();aBox.layoutVertically();aBox.size=new Size(136,0);tx(aBox,ctx.a.name,V.mainSize,new Color(C.text),'black',2);main.addSpacer();const vsBox=main.addStack();vsBox.size=new Size(34,0);vsBox.centerAlignContent();const v=tx(vsBox,'VS',13.5,new Color(S.accent),'black');v.centerAlignText();main.addSpacer();const bBox=main.addStack();bBox.layoutVertically();bBox.size=new Size(136,0);const bn=tx(bBox,ctx.b.name,V.mainSize,new Color(C.text),'black',2);bn.rightAlignText();", "}else{w.addSpacer(Math.max(6,V.gap-8));const mainTag=w.addStack();mainTag.addSpacer();tx(mainTag,'MAIN EVENT',6.4,new Color(S.accent),'bold');mainTag.addSpacer();w.addSpacer(2);const main=w.addStack();main.centerAlignContent();const aBox=main.addStack();aBox.layoutVertically();aBox.size=new Size(140,0);tx(aBox,ctx.a.name,V.mainSize,new Color(C.text),'black',2);main.addSpacer();const vsBox=main.addStack();vsBox.size=new Size(30,0);vsBox.centerAlignContent();const v=tx(vsBox,'VS',15.2,new Color(S.accent),'black');v.centerAlignText();main.addSpacer();const bBox=main.addStack();bBox.layoutVertically();bBox.size=new Size(140,0);const bn=tx(bBox,ctx.b.name,V.mainSize,new Color(C.text),'black',2);bn.rightAlignText();")
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected combat-hub pattern not found: {old[:100]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

          t = Path('tests/combat-hub-regression.mjs')
          ts = t.read_text(encoding='utf-8')
          ts = ts.replace("const VERSION='7\\.3\\.0-github'", "const VERSION='7\\.4\\.0-github'")
          if "MAIN EVENT" not in ts:
              ts += "\n// Main-event hierarchy guard\nhas(/'MAIN EVENT',6\\.4,new Color\\(S\\.accent\\),'bold'/, 'MAIN EVENT emphasis label missing');\nhas(/'VS',15\\.2,new Color\\(S\\.accent\\),'black'/, 'Main VS emphasis regressed');\n"
          t.write_text(ts, encoding='utf-8')

      - name: Syntax check
        run: node --check combat-hub.js

      - name: Regression check
        run: node tests/combat-hub-regression.mjs

      - name: Commit patch
        run: |
          git config user.name "combat-hub-bot"
          git config user.email "combat-hub-bot@users.noreply.github.com"
          git add combat-hub.js tests/combat-hub-regression.mjs
          git commit -m "COMBAT HUB v7.4 emphasize main event"
          git push
