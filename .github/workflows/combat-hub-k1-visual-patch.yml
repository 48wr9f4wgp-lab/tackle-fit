name: Combat Hub K1 Visual Patch

on:
  push:
    paths:
      - '.github/workflows/combat-hub-k1-visual-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Patch K-1 hero blend
        shell: python
        run: |
          from pathlib import Path

          p = Path('combat-hub.js')
          s = p.read_text(encoding='utf-8')

          replacements = [
              ("// v7.2.0-github — final visual cleanup / safe-live engine unchanged", "// v7.3.0-github — K-1 hero blend polish / safe-live engine unchanged"),
              ("const VERSION='7.2.0-github';", "const VERSION='7.3.0-github';"),
              ("k1:{heroShade:.57,posterShade:.46,headerShade:.11,mainShade:.12,footShade:.18,veil:.050,gap:17,mainSize:11.8,division:7.3}", "k1:{heroShade:.60,posterShade:.46,headerShade:.10,mainShade:.11,footShade:.17,veil:.055,gap:17,mainSize:11.8,division:7.3}"),
              ("if(a)c.drawImageInRect(a,imageRect(a,-5,360,'left'));if(b)c.drawImageInRect(b,imageRect(b,365,360,'right'));", "if(a)c.drawImageInRect(a,imageRect(a,-5,KEY==='k1'?370:360,'left'));if(b)c.drawImageInRect(b,imageRect(b,KEY==='k1'?350:365,KEY==='k1'?375:360,'right'));"),
              ("if(KEY==='k1'){c.setFillColor(new Color(S.accent,.035));c.fillRect(new Rect(0,0,720,338));}", "if(KEY==='k1'){c.setFillColor(new Color(S.accent,.045));c.fillRect(new Rect(0,0,720,338));}")
          ]

          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'expected pattern not found: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Syntax check
        run: node --check combat-hub.js

      - name: Commit patch
        run: |
          git config user.name "combat-hub-bot"
          git config user.email "combat-hub-bot@users.noreply.github.com"
          git add combat-hub.js
          git commit -m "COMBAT HUB v7.3 polish K-1 hero blend"
          git push
