<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef3ff"><title>Tackle Fit</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#eef3ff;color:#101828;display:grid;place-items:center;min-height:100dvh;margin:0}.s{font-size:12px;color:#667085;margin-top:8px}</style></head><body><div><b>Tackle Fit</b><div class="s">読み込み中…</div></div><script>(async()=>{try{const names=Array.from({length:14},(_,i)=>`./tackle-r${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(names.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x+' '+r.status);return r.text()})));const b=parts.join('');const bin=Uint8Array.from(atob(b),c=>c.charCodeAt(0));const txt=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(txt);document.close()}catch(e){document.body.innerHTML='<div><b>読み込みに失敗しました</b><div class="s">'+String(e)+'</div></div>'}})()</script></body></html>
